version: "3.8"

networks:
  monitoring:
    driver: bridge
    internal: true

volumes:
  prometheus_data: {}
  grafana_data: {}

services:

  prometheus-gmail-exporter:
    build:
      context: .
    container_name: prometheus-gmail-exporter
    networks:
      - monitoring
    environment:
      - CONFIG_PATH=/app/config/config.yml
      - GMAIL_CREDENTIALS_PATH=/app/secrets/credentials.json
      - TOKEN_SECRET_PATH=/run/secrets/gmail_token
      - LISTEN_ADDRESS=0.0.0.0:2112
    volumes:
      - ./config:/app/config:ro
      - ./secrets:/app/secrets:ro
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: always

  prometheus:
    image: prom/prometheus:v3.2.0
    networks:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=365d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  grafana:
    image: grafana/grafana:11.0.0
    networks:
      - monitoring
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /var/log/grafana:noexec,nosuid,size=50m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

