{{- if not .Values.gmailCredentials.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-gmail-exporter-go.fullname" . }}-credentials
  labels:
    {{- include "prometheus-gmail-exporter-go.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: |
    {
      "installed": {
        "client_id": {{ .Values.gmailCredentials.clientId | quote }},
        "client_secret": {{ .Values.gmailCredentials.clientSecret | quote }},
        "auth_uri": "https://accounts.google.com/o/oauth2/auth",
        "token_uri": "https://oauth2.googleapis.com/token",
        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
        "redirect_uris": [
          "urn:ietf:wg:oauth:2.0:oob",
          "http://localhost"
        ]
      }
    }
{{- end }}

{{- if not .Values.gmailToken.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-gmail-exporter-go.fullname" . }}-token
  labels:
    {{- include "prometheus-gmail-exporter-go.labels" . | nindent 4 }}
type: Opaque
stringData:
  token.json: {{ .Values.gmailToken.tokenJson | quote }}
{{- end }}
