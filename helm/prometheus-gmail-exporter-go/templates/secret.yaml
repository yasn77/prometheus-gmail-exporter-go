{{/* Determine whether to use an existing secret or a chart-managed secret */}}
{{- $useExistingSecret := .Values.gmail.existingSecret.name }}
{{- $credentials := .Values.gmail.credentials | default dict }}
{{- $useInlineCredentials := and (hasKey $credentials "clientId") $credentials.clientId (hasKey $credentials "clientSecret") $credentials.clientSecret }}
{{- $token := .Values.gmail.token | default dict }}
{{- $useInlineToken := and (hasKey $token "tokenJson") $token.tokenJson }}
{{- $useInline := or $useInlineCredentials $useInlineToken }}

{{- if not $useExistingSecret }}
{{- if $useInline }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prometheus-gmail-exporter-go.fullname" . }}-gmail-auth
  labels:
    {{- include "prometheus-gmail-exporter-go.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $useInlineCredentials }}
  credentials.json: |
    {
      "installed": {
        "client_id": {{ $credentials.clientId | quote }},
        "client_secret": {{ $credentials.clientSecret | quote }},
        "auth_uri": "https://accounts.google.com/o/oauth2/auth",
        "token_uri": "https://oauth2.googleapis.com/token",
        "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
        "redirect_uris": [
          "urn:ietf:wg:oauth:2.0:oob",
          "http://localhost"
        ]
      }
    }
  {{- end }}
  {{- if $useInlineToken }}
  token.json: {{ $token.tokenJson | quote }}
  {{- end }}
{{- else }}
{{- fail "Gmail authentication not configured. Either set gmail.existingSecret.name with secret references, or set inline gmail.credentials and gmail.token values." }}
{{- end }}
{{- end }}
